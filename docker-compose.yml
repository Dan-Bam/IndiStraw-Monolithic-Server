version: "3"

services:
  mysql:
    image: mysql:9.0.0
    container_name: indistraw-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    ports:
      - "3306:3306"
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    env_file:
      - .env

  redis:
    image: redis
    container_name: indistraw-redis
    ports:
      - "6379:6379"

  spring:
    build:
      context: .
      dockerfile: Dockerfile
    image: kimgyeongsu/indistraw-service
    container_name: indistraw-service
    ports:
      - 8080:8080
    depends_on:
      - mysql
      - redis
    env_file:
      - .env